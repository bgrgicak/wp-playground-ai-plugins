name: Sync Skills from WordPress/agent-skills

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 09:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone agent-skills
        run: |
          TMPDIR=$(mktemp -d)
          git clone --depth 1 --branch trunk https://github.com/WordPress/agent-skills.git "$TMPDIR"

          # Copy blueprint skill
          mkdir -p skills/blueprint
          cp "$TMPDIR/skills/blueprint/SKILL.md" skills/blueprint/SKILL.md

          # Copy wp-playground skill and references
          mkdir -p skills/wp-playground/references
          cp "$TMPDIR/skills/wp-playground/SKILL.md" skills/wp-playground/SKILL.md
          if [ -d "$TMPDIR/skills/wp-playground/references" ]; then
            cp "$TMPDIR/skills/wp-playground/references/"* skills/wp-playground/references/
          fi

          rm -rf "$TMPDIR"

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/sync-skills
          title: "chore: sync skills from WordPress/agent-skills"
          body: |
            Automated update of skills from [WordPress/agent-skills](https://github.com/WordPress/agent-skills).

            This PR was created by the `sync-skills` workflow.
          commit-message: "chore: sync skills from WordPress/agent-skills"
          delete-branch: true
